<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Delville — accès protégé</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&display=swap">
<style>
  :root{--ground:#03201D;--panel2:#123832;--green:#6BFF86;--green-deep:#10DC49;--ink:#0B1F1B;--mist:#9DB8AE;--line:rgba(255,255,255,.14);--danger:#FFB4A2}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ground);color:#F2F7F4;font-family:'Hanken Grotesk',-apple-system,'Segoe UI',Arial,sans-serif;
       min-height:100vh;display:grid;place-items:center;padding:24px;font-size:16px;line-height:1.5}
  .box{width:100%;max-width:400px}
  .mark{height:56px;width:auto;display:block;margin-bottom:26px}
  h1{font-size:26px;font-weight:800;letter-spacing:-.5px;line-height:1.15;margin-bottom:8px}
  p{color:var(--mist);font-size:14.5px;margin-bottom:20px}
  label{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mist);margin-bottom:7px}
  input{width:100%;font:inherit;font-size:16px;padding:13px 15px;border-radius:6px;border:1.5px solid var(--line);
        background:var(--panel2);color:#fff;margin-bottom:12px}
  input:focus{outline:none;border-color:var(--green)}
  button{width:100%;border:none;border-radius:6px;background:var(--green);color:var(--ink);
         font:inherit;font-weight:800;font-size:16px;padding:14px;cursor:pointer}
  button:hover{background:var(--green-deep)}
  button:disabled{opacity:.5;cursor:default}
  .err{color:var(--danger);font-size:14px;margin-top:12px;min-height:20px}
</style>

var SALT_LEN = 16, IV_LEN = 12, ITER = 600000;
var f = document.getElementById("f"), e = document.getElementById("e"), b = document.getElementById("b");
function b64(s){ var raw = atob(s); return Uint8Array.from(raw, function(c){ return c.charCodeAt(0); }); }
f.addEventListener("submit", function(ev){
  ev.preventDefault();
  var pass = document.getElementById("p").value;
  if(!pass) return;
  if(!(window.crypto && crypto.subtle)){
    e.innerHTML = "Ce navigateur ne donne pas accès au déchiffrement sur cette adresse.<br>" +
                  "Ouvrez la page via son lien https, pas depuis un fichier local.";
    return;
  }
  e.textContent = ""; b.disabled = true; b.textContent = "Déchiffrement…";
  var data = b64(PAYLOAD);
  var salt = data.slice(0, SALT_LEN);
  var iv = data.slice(SALT_LEN, SALT_LEN + IV_LEN);
  var ct = data.slice(SALT_LEN + IV_LEN);
  var enc = new TextEncoder();
  crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"])
    .then(function(km){
      return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt:salt, iterations:ITER, hash:"SHA-256"},
        km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    })
    .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct); })
    .then(function(buf){
      var html = new TextDecoder().decode(buf);
      document.open(); document.write(html); document.close();
    })
    .catch(function(){
      b.disabled = false; b.textContent = "Ouvrir le questionnaire";
      e.textContent = "Phrase de passe incorrecte.";
    });
});
